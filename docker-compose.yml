version: "3.9"

services:
  run-titler:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DB_PATH so the database lives on the persistent volume,
      # not inside the container's writable layer (which is lost on redeploy).
      DB_PATH: /data/run_titler.db
    volumes:
      - titler_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  titler_data:
    driver: local
